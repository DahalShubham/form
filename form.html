<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 32px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-inline {
      display: flex;
      gap: 16px;
    }

    .form-inline .form-field {
      flex: 1;
    }

    .form-field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="email"],
    select {
      width: 100%;
      padding: 11px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      background: #ffffff;
    }

    .invalid {
      border-color: #e74c3c !important;
    }

    .valid {
      border-color: #2ecc71 !important;
    }

    .error {
      display: block;
      min-height: 16px;
      margin-top: 5px;
      font-size: 12.5px;
      color: #e74c3c;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-option,
    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 9px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-weight: normal;
      cursor: pointer;
      background: #fafafa;
    }

    .checkbox-option:hover,
    .radio-option:hover {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    #successMsg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #e8f8f0;
      color: #1e8449;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .form-inline {
        flex-direction: column;
        gap: 0;
      }

      .container {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Application Form</h1>
    <p class="subtitle">Please fill in all the fields</p>

    <form id="appForm" novalidate>

      <div class="form-inline">
        <div class="form-field">
          <label for="fname">First name</label>
          <input type="text" id="fname" name="fname" placeholder="Enter first name">
          <small class="error" id="fnameError"></small>
        </div>
        <div class="form-field">
          <label for="lname">Last name</label>
          <input type="text" id="lname" name="lname" placeholder="Enter last name">
          <small class="error" id="lnameError"></small>
        </div>
      </div>

      <div class="form-field">
        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="pwd" placeholder="Minimum 8 characters">
        <small class="error" id="pwdError"></small>
      </div>

      <div class="form-inline">
        <div class="form-field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" placeholder="Enter age">
          <small class="error" id="ageError"></small>
        </div>
        <div class="form-field">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob">
          <small class="error" id="dobError"></small>
        </div>
      </div>

      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="Enter email address">
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-field">
        <label for="gender">Gender</label>
        <select name="gender" id="gender">
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="others">Others</option>
        </select>
        <small class="error" id="genderError"></small>
      </div>

      <div class="form-field">
        <label>Programming Languages</label>
        <div class="options">
          <label class="checkbox-option"><input type="checkbox" name="languages" value="java"> Java</label>
          <label class="checkbox-option"><input type="checkbox" name="languages" value="javascript"> JavaScript</label>
          <label class="checkbox-option"><input type="checkbox" name="languages" value="python"> Python</label>
        </div>
        <small class="error" id="languagesError"></small>
      </div>

      <div class="form-field">
        <label>Position Available</label>
        <div class="options">
          <label class="radio-option"><input type="radio" name="position" value="junior"> Junior Developer</label>
          <label class="radio-option"><input type="radio" name="position" value="mid"> Mid-level Developer</label>
          <label class="radio-option"><input type="radio" name="position" value="senior"> Senior Developer</label>
        </div>
        <small class="error" id="positionError"></small>
      </div>

      <button type="submit">Submit Application</button>
      <p id="successMsg"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("appForm");
    const successMsg = document.getElementById("successMsg");
    const dobInput = document.getElementById("dob");
    dobInput.max = new Date().toISOString().split("T")[0];

    function setError(id, message) {
      const input = document.getElementById(id);
      const error = document.getElementById(id + "Error");

      error.textContent = message;


      if (input) {
        if (message === "") {
          input.classList.remove("invalid");
          input.classList.add("valid");
        } else {
          input.classList.remove("valid");
          input.classList.add("invalid");
        }
      }
      return message === "";
    }

    function calculateAge(dobValue) {
      const dob = new Date(dobValue);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const monthDiff = today.getMonth() - dob.getMonth();

      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
        age--;
      }
      return age;
    }

    function validateName(id, label) {
      const value = document.getElementById(id).value.trim();

      if (value === "") {
        return setError(id, label + " is required");
      }
      if (!/^[A-Za-z]{2,}$/.test(value)) {
        return setError(id, "Use only letters, minimum 2 characters");
      }
      return setError(id, "");
    }

    function validateFname() {
      return validateName("fname", "First name");
    }

    function validateLname() {
      return validateName("lname", "Last name");
    }

    function validatePassword() {
      const value = document.getElementById("pwd").value;

      if (value === "") {
        return setError("pwd", "Password is required");
      }
      if (value.length < 8) {
        return setError("pwd", "Password must be at least 8 characters");
      }
      if (!/[A-Za-z]/.test(value) || !/[0-9]/.test(value)) {
        return setError("pwd", "Password must have letters and numbers");
      }
      return setError("pwd", "");
    }

    function validateAge() {
      const value = document.getElementById("age").value.trim();

      if (value === "") {
        return setError("age", "Age is required");
      }
      const age = Number(value);

      if (!Number.isInteger(age) || age < 16 || age > 60) {
        return setError("age", "Age must be a whole number between 16 and 60");
      }
      return setError("age", "");
    }

    function validateDob() {
      const value = document.getElementById("dob").value;

      if (value === "") {
        return setError("dob", "Date of birth is required");
      }
      if (new Date(value) > new Date()) {
        return setError("dob", "Date cannot be in the future");
      }
      const realAge = calculateAge(value);
      const enteredAge = document.getElementById("age").value.trim();

      if (realAge < 16) {
        return setError("dob", "You must be at least 16 years old");
      }
      if (enteredAge !== "" && Number(enteredAge) !== realAge) {
        return setError("dob", "Age does not match date of birth (" + realAge + ")");
      }
      return setError("dob", "");
    }

    function validateEmail() {
      const value = document.getElementById("email").value.trim();

      if (value === "") {
        return setError("email", "Email is required");
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        return setError("email", "Enter a valid email address");
      }
      return setError("email", "");
    }

    function validateGender() {
      const value = document.getElementById("gender").value;

      if (value === "") {
        return setError("gender", "Please select a gender");
      }
      return setError("gender", "");
    }

    function validateLanguages() {
      const checked = document.querySelectorAll('input[name="languages"]:checked');

      if (checked.length === 0) {
        return setError("languages", "Select at least one language");
      }
      return setError("languages", "");
    }

    function validatePosition() {
      const selected = document.querySelector('input[name="position"]:checked');

      if (selected === null) {
        return setError("position", "Please select a position");
      }
      return setError("position", "");
    }
    document.getElementById("fname").addEventListener("blur", validateFname);
    document.getElementById("lname").addEventListener("blur", validateLname);
    document.getElementById("pwd").addEventListener("blur", validatePassword);
    document.getElementById("age").addEventListener("blur", validateAge);
    document.getElementById("dob").addEventListener("change", validateDob);
    document.getElementById("email").addEventListener("blur", validateEmail);
    document.getElementById("gender").addEventListener("change", validateGender);

    document.querySelectorAll('input[name="languages"]').forEach(function (box) {
      box.addEventListener("change", validateLanguages);
    });
    document.querySelectorAll('input[name="position"]').forEach(function (radio) {
      radio.addEventListener("change", validatePosition);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      successMsg.style.display = "none";

      const isValid =
        validateFname() &
        validateLname() &
        validatePassword() &
        validateAge() &
        validateDob() &
        validateEmail() &
        validateGender() &
        validateLanguages() &
        validatePosition();

      if (!isValid) {
        const firstError = document.querySelector(".error:not(:empty)");
        firstError.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      const name = document.getElementById("fname").value.trim();
      successMsg.textContent = "Thank you " + name + "! Your application has been submitted.";
      successMsg.style.display = "block";

      form.reset();
      document.querySelectorAll(".valid").forEach(function (el) {
        el.classList.remove("valid");
      });
    });
  </script>
</body>

</html>
